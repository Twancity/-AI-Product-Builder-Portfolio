kind = "web"
previewPath = "/"
title = "CareBridge"
description = "A mobile-friendly educational portfolio prototype demonstrating exact retrieval from fictional discharge-plan sources, transparent synthetic metadata, and safe handling when an instruction is absent."
version = "1.0.0"
id = "artifacts/carebridge"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21211

[services.development]
run = "pnpm --filter @workspace/carebridge run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/carebridge", "run", "build" ]
serve = "static"
publicDir = "artifacts/carebridge/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21211"
BASE_PATH = "/"
